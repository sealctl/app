name: iOS

# SPEC.md 17.1 ios.yml: the XCFramework, the Swift packages' tests on macOS and on the
# simulator, and the UI tests against the fake relay with the fake machine and the real
# sealctl CLI. With the SEALCTL_STAGING_RELAY secret, the end-to-end tests also run against
# the staging relay. No signing: everything runs on the simulator.

# No workflow path filter: the `changes` job (Linux, a few seconds) runs scripts/select-tests.py,
# which maps the pull request's files through .github/test-map (SPEC 17.1, "Test selection").
# The macOS job starts only when iOS is affected, and then runs only the Swift package tests and
# the UI test classes the change can affect. Push to main and manual runs, a path the map does
# not know, the Cargo files (the sealctl-core pin), shared/, tools/, the workflows and the label
# `ci:full` run everything.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: "xcodebuild -only-testing for the UI tests (empty: all)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # one run per pull request (a new push cancels the old run); push, schedule and manual runs
  # get a group of their own, so a run on main is never cancelled or replaced
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  FAKE_RELAY: http://127.0.0.1:8787

jobs:
  # The free plan runs 5 macOS jobs at a time and the UI tests take about an hour: select what
  # this pull request needs. Outputs: full, ios (the macOS job), packages (Swift package tests),
  # simulator (their test targets in the sealctl scheme), ui (" all " or " <Class> ... ").
  # If this job fails, the iOS job runs everything (the outputs are then empty, never "false").
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.select.outputs.full }}
      ios: ${{ steps.select.outputs.ios }}
      packages: ${{ steps.select.outputs.packages }}
      simulator: ${{ steps.select.outputs.simulator }}
      ui: ${{ steps.select.outputs.ui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the selection itself: example file lists and the suites they select
      - name: Test selection tests
        run: python3 -B scripts/select-tests-test.py
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: python3 -B scripts/select-tests.py --github

  ios:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ios != 'false' }}
    runs-on: macos-26
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Xcode and Rust
        run: |
          xcodebuild -version
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin

      # XcodeGen from its GitHub release, pinned by version and checksum (not whatever Homebrew
      # has); 2.46.0 is the version the runner's Homebrew installed before.
      - name: XcodeGen
        env:
          XCODEGEN_VERSION: "2.46.0"
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version

      # Caches written by pull request runs are scoped to that pull request's ref; runs on main
      # only restore caches written on main, so a pull request cannot poison them.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Cached XCFramework
        id: xcf
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ios/Packages/SealCore/SealctlFFI.xcframework
          key: xcf-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'shared/**', 'scripts/build-core-ios.sh') }}

      - name: Core XCFramework and Swift bindings
        env:
          XCF_CACHE_HIT: ${{ steps.xcf.outputs.cache-hit }}
        run: |
          if [ "$XCF_CACHE_HIT" = true ]; then BINDINGS_ONLY=1 scripts/build-core-ios.sh; else scripts/build-core-ios.sh; fi
          git diff --exit-code -- ios/Packages/SealCore/Sources

      - name: Simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          best = None
          for rt, devs in json.load(sys.stdin)["devices"].items():
              if "SimRuntime.iOS-" not in rt:
                  continue
              ver = tuple(int(x) for x in rt.split("iOS-")[1].split("-"))
              for d in devs:
                  if d["name"].startswith("iPhone") and "SE" not in d["name"] and (best is None or ver > best[0]):
                      best = (ver, d["udid"], d["name"])
          print(best[1]); print(best[2], best[0], file=sys.stderr)')
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          # Face ID enrolled: the simulator then counts as having a passcode.
          xcrun simctl spawn "$udid" notifyutil -s com.apple.BiometricKit.enrollmentChanged 1
          xcrun simctl spawn "$udid" notifyutil -p com.apple.BiometricKit.enrollmentChanged

      - name: Xcode project
        run: cd ios && xcodegen generate

      - name: Build for testing
        run: |
          for scheme in sealctlUITests sealctl; do
            if ! xcodebuild build-for-testing -project ios/sealctl.xcodeproj -scheme $scheme \
                -destination "id=$SIM_UDID" -derivedDataPath "$RUNNER_TEMP/dd" > "$RUNNER_TEMP/build-$scheme.log" 2>&1; then
              grep -E "error:|error -|FAILED|failed" "$RUNNER_TEMP/build-$scheme.log" | sort -u | head -150
              tail -60 "$RUNNER_TEMP/build-$scheme.log"
              exit 1
            fi
            grep -E "warning: .*\.swift" "$RUNNER_TEMP/build-$scheme.log" | sort -u | head -40 || true
          done

      - name: Fake relay, fake machine and the sealctl CLI
        run: |
          cargo build --release -p fake-relay -p fake-machine
          echo "FAKE_MACHINE_BIN=$PWD/target/release/fake-machine" >> "$GITHUB_ENV"
          echo "FAKE_RELAY_BIN=$PWD/target/release/fake-relay" >> "$GITHUB_ENV"
          # The CLI at the same sealctl commit as the core the app is built on (Cargo.lock).
          rev=$(sed -n 's/.*sealctl?rev=[0-9a-f]*#\([0-9a-f]*\)".*/\1/p' Cargo.lock | head -1)
          git clone -q --filter=blob:none https://github.com/sealctl/sealctl "$RUNNER_TEMP/sealctl"
          git -C "$RUNNER_TEMP/sealctl" checkout -q "$rev"
          (cd "$RUNNER_TEMP/sealctl" && git log -1 --format='sealctl CLI at %h %s' && cargo build -q -p sealctl)
          echo "SEALCTL_BIN=$RUNNER_TEMP/sealctl/target/debug/sealctl" >> "$GITHUB_ENV"
          nohup target/release/fake-relay --bind 127.0.0.1:8787 > "$RUNNER_TEMP/fake-relay.log" 2>&1 &
          sleep 1 && curl -fsS "$FAKE_RELAY/v1/health"

      # The test log is printed as the tests run; a package still running after LIMIT seconds
      # prints the tests that never finished and every thread's stack, then fails.
      # The packages the change affects (all of them when `changes` selected everything).
      - name: Package tests on macOS (vectors, relay client, engine end to end)
        if: needs.changes.outputs.full != 'false' || needs.changes.outputs.packages != ''
        timeout-minutes: 15
        env:
          SEALCTL_TEST_RELAY: ${{ env.FAKE_RELAY }}
          LIMIT: 300
          FULL: ${{ needs.changes.outputs.full }}
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: |
          if [ "$FULL" != false ]; then PACKAGES="SealCore Vault Relay Engine DesignSystem"; fi
          # shellcheck disable=SC2086 # one package per word
          ios/scripts/package-tests.sh $PACKAGES

      - name: Unit tests on the simulator (vectors through the Swift bindings, vault, relay)
        if: needs.changes.outputs.full != 'false' || needs.changes.outputs.simulator != ''
        env:
          TEST_RUNNER_SEALCTL_TEST_RELAY: ${{ env.FAKE_RELAY }}
          FULL: ${{ needs.changes.outputs.full }}
          TARGETS: ${{ needs.changes.outputs.simulator }}
        run: |
          set -o pipefail
          only=()
          if [ "$FULL" = false ]; then
            for t in $TARGETS; do only+=("-only-testing:$t"); done
          fi
          xcodebuild test-without-building -project ios/sealctl.xcodeproj -scheme sealctl \
            -destination "id=$SIM_UDID" -derivedDataPath "$RUNNER_TEMP/dd" "${only[@]}" \
            -resultBundlePath "$RUNNER_TEMP/unit.xcresult" | tail -60

      # The UI test classes the change affects (`ui` is " all " or " <Class> ... "); a manual
      # run's `only` input picks its own.
      - name: UI tests (fake relay, fake machine, sealctl CLI)
        if: needs.changes.outputs.full != 'false' || needs.changes.outputs.ui != ''
        env:
          ONLY: ${{ inputs.only }}
          FULL: ${{ needs.changes.outputs.full }}
          UI: ${{ needs.changes.outputs.ui }}
          TEST_RUNNER_SEALCTL_RELAY: ${{ env.FAKE_RELAY }}
          TEST_RUNNER_SEALCTL_TEST_DELAY: "20"
        run: |
          set -o pipefail
          SEALCTL_RELAY="$FAKE_RELAY" nohup python3 ios/scripts/harness.py 8790 > "$RUNNER_TEMP/harness.log" 2>&1 &
          sleep 1
          only=()
          if [ -n "$ONLY" ]; then
            only=("-only-testing:$ONLY")
          elif [ "$FULL" = false ] && [ "$UI" != " all " ]; then
            for c in $UI; do only+=("-only-testing:sealctlUITests/$c"); done
          fi
          echo "UI tests: ${only[*]:-all}"
          xcodebuild test-without-building -project ios/sealctl.xcodeproj -scheme sealctlUITests \
            -destination "id=$SIM_UDID" -derivedDataPath "$RUNNER_TEMP/dd" "${only[@]}" \
            -resultBundlePath "$RUNNER_TEMP/ui.xcresult" | grep -E "Test Case|error|failed|passed|skipped|\*\*" | tail -200
          pkill -f harness.py || true

      # With the secret, and only when everything runs or the selection holds these classes.
      - name: End to end against the staging relay (fake machine and sealctl CLI)
        env:
          STAGING: ${{ secrets.SEALCTL_STAGING_RELAY }}
          TEST_RUNNER_SEALCTL_TEST_DELAY: "20"
        if: >-
          ${{ env.STAGING != '' && (needs.changes.outputs.full != 'false'
          || contains(needs.changes.outputs.ui, ' all ')
          || contains(needs.changes.outputs.ui, ' StagingTests ')
          || contains(needs.changes.outputs.ui, ' CLIEndToEndTests ')) }}
        run: |
          set -o pipefail
          export TEST_RUNNER_SEALCTL_RELAY="$STAGING"
          SEALCTL_RELAY="$STAGING" nohup python3 ios/scripts/harness.py 8790 > "$RUNNER_TEMP/harness-staging.log" 2>&1 &
          sleep 1
          xcodebuild test-without-building -project ios/sealctl.xcodeproj -scheme sealctlUITests \
            -destination "id=$SIM_UDID" -derivedDataPath "$RUNNER_TEMP/dd" \
            -only-testing:sealctlUITests/StagingTests -only-testing:sealctlUITests/CLIEndToEndTests \
            -resultBundlePath "$RUNNER_TEMP/staging.xcresult" | grep -E "Test Case|error|failed|passed|skipped|\*\*" | tail -200
          pkill -f harness.py || true

      - name: Attachments of failed UI tests
        if: failure()
        run: |
          # The failed UI tests' attachments (the screenshot XCTest takes at a failure) as plain
          # files in ios-results, so a failure can be read without Xcode. These runs use the fake
          # relay and test phones only, and the artifact is kept 7 days, but screens that show
          # or take recovery words are not all in the secure layer: failure-attachments.py keeps
          # a test's files only when its failure shows a UI tree with no word screen, and deletes
          # the rest (fails closed). Failed tests only; never the staging run's results.
          [ -d "$RUNNER_TEMP/ui.xcresult" ] || exit 0
          out="$RUNNER_TEMP/ui-failures"
          mkdir -p "$out"
          if xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ui.xcresult" --output-path "$out" --only-failures; then
            python3 -I ios/scripts/failure-attachments.py "$RUNNER_TEMP/ui.xcresult" "$out" || rm -rf "$out"
          else
            echo "::warning::xcresulttool could not export the attachments"
            rm -rf "$out"
          fi

      - name: Logs and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-results
          retention-days: 7
          # No raw .xcresult bundles: they hold every failure screenshot and UI tree, words
          # screens included (the workspace rule: a test phone's words are never in a file or
          # screenshot). Failed UI tests' attachments come filtered in ui-failures. Never the
          # staging run's results either: they would name the private staging relay.
          path: |
            ${{ runner.temp }}/ui-failures
            ${{ runner.temp }}/fake-relay.log
            ${{ runner.temp }}/harness.log
            ${{ runner.temp }}/build-*.log
