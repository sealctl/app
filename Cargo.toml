[workspace]
resolver = "2"
members = ["shared", "tools/fake-relay", "tools/fake-machine", "tools/uniffi-bindgen"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-only"
repository = "https://github.com/sealctl/app"

[workspace.dependencies]
sealctl-core = { git = "https://github.com/sealctl/sealctl", rev = "088207405ec7992075e995f3b1b1e2ed19e7e6e9" }
uniffi = { version = "=0.32.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
