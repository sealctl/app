name: iOS

# SPEC.md 17.1 ios.yml: the XCFramework, the Swift packages' tests on macOS and on the
# simulator, and the UI tests against the fake relay with the fake machine and the real
# sealctl CLI. With the SEALCTL_STAGING_RELAY secret, the end-to-end tests also run against
# the staging relay. No signing: everything runs on the simulator.

on:
  push:
    branches: [main]
    paths: ["ios/**", "shared/**", "tools/**", "scripts/build-core-ios.sh", "scripts/check-core.sh", "Cargo.toml", "Cargo.lock", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", "shared/**", "tools/**", "scripts/build-core-ios.sh", "scripts/check-core.sh", "Cargo.toml", "Cargo.lock", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      only:
        description: "xcodebuild -only-testing for the UI tests (empty: all)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FAKE_RELAY: http://127.0.0.1:8787

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Xcode and Rust
        run: |
          xcodebuild -version
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - uses: Swatinem/rust-cache@v2

      - name: Cached XCFramework
        id: xcf
        uses: actions/cache@v4
        with:
          path: ios/Packages/SealCore/SealctlFFI.xcframework
          key: xcf-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'shared/**', 'scripts/build-core-ios.sh') }}

      - name: Core XCFramework and Swift bindings
        run: |
          if [ "${{ steps.xcf.outputs.cache-hit }}" = true ]; then BINDINGS_ONLY=1 scripts/build-core-ios.sh; else scripts/build-core-ios.sh; fi
          git diff --exit-code -- ios/Packages/SealCore/Sources

      - name: Simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          best = None
          for rt, devs in json.load(sys.stdin)["devices"].items():
              if "SimRuntime.iOS-" not in rt:
                  continue
              ver = tuple(int(x) for x in rt.split("iOS-")[1].split("-"))
              for d in devs:
                  if d["name"].startswith("iPhone") and "SE" not in d["name"] and (best is None or ver > best[0]):
                      best = (ver, d["udid"], d["name"])
          print(best[1]); print(best[2], best[0], file=sys.stderr)')
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          # Face ID enrolled: the simulator then counts as having a passcode.
          xcrun simctl spawn "$udid" notifyutil -s com.apple.BiometricKit.enrollmentChanged 1
          xcrun simctl spawn "$udid" notifyutil -p com.apple.BiometricKit.enrollmentChanged

      - name: Xcode project
        run: cd ios && xcodegen generate

      - name: Build for testing
        run: |
          for scheme in sealctlUITests sealctl; do
            if ! xcodebuild build-for-testing -project ios/sealctl.xcodeproj -scheme $scheme \
                -destination "id=$SIM_UDID" -derivedDataPath "$RUNNER_TEMP/dd" > "$RUNNER_TEMP/build-$scheme.log" 2>&1; then
              grep -E "error:|error -|FAILED|failed" "$RUNNER_TEMP/build-$scheme.log" | sort -u | head -150
              tail -60 "$RUNNER_TEMP/build-$scheme.log"
              exit 1
            fi
            grep -E "warning: .*\.swift" "$RUNNER_TEMP/build-$scheme.log" | sort -u | head -40 || true
          done

      - name: Fake relay, fake machine and the sealctl CLI
        run: |
          cargo build --release -p fake-relay -p fake-machine
          echo "FAKE_MACHINE_BIN=$PWD/target/release/fake-machine" >> "$GITHUB_ENV"
          git clone --depth 1 --branch phone https://github.com/sealctl/sealctl "$RUNNER_TEMP/sealctl"
          (cd "$RUNNER_TEMP/sealctl" && git log -1 --format='sealctl CLI at %h %s' && cargo build -q -p sealctl)
          echo "SEALCTL_BIN=$RUNNER_TEMP/sealctl/target/debug/sealctl" >> "$GITHUB_ENV"
          nohup target/release/fake-relay --bind 127.0.0.1:8787 > "$RUNNER_TEMP/fake-relay.log" 2>&1 &
          sleep 1 && curl -fsS "$FAKE_RELAY/v1/health"

      - name: Package tests on macOS (vectors, relay client, engine end to end)
        env:
          SEALCTL_TEST_RELAY: ${{ env.FAKE_RELAY }}
        run: |
          for p in SealCore Vault Relay Engine; do
            echo "::group::$p"
            (cd "ios/Packages/$p" && swift test) || exit 1
            echo "::endgroup::"
          done

      - name: Unit tests on the simulator (vectors through the Swift bindings, vault, relay)
        env:
          TEST_RUNNER_SEALCTL_TEST_RELAY: ${{ env.FAKE_RELAY }}
        run: |
          set -o pipefail
          xcodebuild test-without-building -project ios/sealctl.xcodeproj -scheme sealctl \
            -destination "id=$SIM_UDID" -derivedDataPath "$RUNNER_TEMP/dd" \
            -resultBundlePath "$RUNNER_TEMP/unit.xcresult" | tail -60

      - name: UI tests (fake relay, fake machine, sealctl CLI)
        env:
          TEST_RUNNER_SEALCTL_RELAY: ${{ env.FAKE_RELAY }}
          TEST_RUNNER_SEALCTL_TEST_DELAY: "20"
        run: |
          set -o pipefail
          SEALCTL_RELAY="$FAKE_RELAY" nohup python3 ios/scripts/harness.py 8790 > "$RUNNER_TEMP/harness.log" 2>&1 &
          sleep 1
          only=""
          [ -n "${{ inputs.only }}" ] && only="-only-testing:${{ inputs.only }}"
          xcodebuild test-without-building -project ios/sealctl.xcodeproj -scheme sealctlUITests \
            -destination "id=$SIM_UDID" -derivedDataPath "$RUNNER_TEMP/dd" $only \
            -resultBundlePath "$RUNNER_TEMP/ui.xcresult" | grep -E "Test Case|error|failed|passed|skipped|\*\*" | tail -200
          pkill -f harness.py || true

      - name: End to end against the staging relay (fake machine and sealctl CLI)
        env:
          STAGING: ${{ secrets.SEALCTL_STAGING_RELAY }}
          TEST_RUNNER_SEALCTL_TEST_DELAY: "20"
        if: ${{ env.STAGING != '' }}
        run: |
          set -o pipefail
          export TEST_RUNNER_SEALCTL_RELAY="$STAGING"
          SEALCTL_RELAY="$STAGING" nohup python3 ios/scripts/harness.py 8790 > "$RUNNER_TEMP/harness-staging.log" 2>&1 &
          sleep 1
          xcodebuild test-without-building -project ios/sealctl.xcodeproj -scheme sealctlUITests \
            -destination "id=$SIM_UDID" -derivedDataPath "$RUNNER_TEMP/dd" \
            -only-testing:sealctlUITests/StagingTests -only-testing:sealctlUITests/CLIEndToEndTests \
            -resultBundlePath "$RUNNER_TEMP/staging.xcresult" | grep -E "Test Case|error|failed|passed|skipped|\*\*" | tail -200
          pkill -f harness.py || true

      - name: Logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-results
          retention-days: 7
          # Never the staging run's results: they would name the private staging relay.
          path: |
            ${{ runner.temp }}/unit.xcresult
            ${{ runner.temp }}/ui.xcresult
            ${{ runner.temp }}/fake-relay.log
            ${{ runner.temp }}/harness.log
            ${{ runner.temp }}/build-*.log
