[package]
name = "fake-relay"
description = "In-memory implementation of the sealctl Relay API with test controls (SPEC.md 16.3)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "fake_relay"
path = "src/lib.rs"

[[bin]]
name = "fake-relay"
path = "src/main.rs"

[dependencies]
sealctl-core = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
futures-util = { version = "0.3", features = ["sink"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
fake-machine = { path = "../fake-machine" }
