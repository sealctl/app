# cargo deny check (CI: .github/workflows/supply-chain.yml). Mirrors sealctl's policy.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # basic-toml (via uniffi_bindgen -> askama): archived upstream, no fixed release. It parses
    # askama's template config while the UniFFI bindings are generated; it never runs in the
    # apps. Drop this when UniFFI moves off askama 0.16.
    { id = "RUSTSEC-2026-0374", reason = "build-time only (UniFFI binding templates); no fixed release" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
# The workspace's own crates and sealctl-core (AGPL-3.0-only, publish = false).
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# sealctl-core from the sealctl repo (Cargo.lock pins the commit).
allow-git = ["https://github.com/sealctl/sealctl"]
