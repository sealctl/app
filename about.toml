# cargo-about: licence notices for the Rust library both apps ship (sealctl-app with
# sealctl-core). Output: notices/rust-crates.txt, shown in Settings → Licences on iOS and
# Android. Regenerate with scripts/notices.sh when Cargo.lock changes; `--check` says whether
# the committed file is stale.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "AGPL-3.0-only",
]
# The app targets: iOS device and simulators, Android ABIs.
targets = [
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "x86_64-apple-ios",
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
